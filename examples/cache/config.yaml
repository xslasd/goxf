goxf:
  serviceName: cache-demo
  enableConsole: true

logger:
  default:
    level: debug
    dir: .
    async: false
    addCaller: true
    callerSkip: 2
    maxSize: 1
    maxAge: 1
    maxBackup: 2
    enableTimeLayout: true

cache:
  golanglru:
    default:
      name: lru-cache
      size: 100
      expiration: 2s
      algorithm: lru
      enableMetric: true
    user_cache:
      name: 2q-cache
      size: 50
      expiration: 1s
      algorithm: 2q
      enableMetric: true
